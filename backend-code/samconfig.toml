# ---------------------------------------------------------------------------
# Committed on purpose: `npm run deploy` works from a fresh clone with no
# edits. Everything here is a public identifier — a Cognito pool id and app
# client id ship inside the browser bundle anyway.
#
# NEVER add CognitoClientSecret or ResetTokenSecret to parameter_overrides.
# This file is in git. Both are secrets and live in .env (gitignored); pass
# them at deploy time with `npm run deploy:env`, which sources .env and
# repeats every parameter below on the command line.
#
# Why repeated: a --parameter-overrides on the CLI REPLACES this whole list,
# it does not merge into it. Anything left off the command line falls back to
# the template default (or fails, for a parameter with no default).
#
# To change any of this, use `npm run deploy:guided` — it re-prompts and
# rewrites this file. Verify what it wrote before committing: guided saves
# capabilities = "CAPABILITY_IAM", which this template rejects.
# ---------------------------------------------------------------------------
version = 0.1

[default.global.parameters]
region = "ap-south-1"

[default.deploy.parameters]
stack_name = "internal-demo-dev"
s3_prefix = "internal-demo-dev"
region = "ap-south-1"
resolve_s3 = true

# The execution role has an explicit RoleName, so NAMED is required. The npm
# scripts also pass this on the command line, which wins over this file.
capabilities = "CAPABILITY_NAMED_IAM"

# Prints the resource diff and waits for y/N. Set false for unattended CI.
confirm_changeset = true

# false so a failed create rolls itself back instead of stranding the stack
# in CREATE_FAILED for someone to delete by hand.
disable_rollback = false

image_repositories = []

# ManageApiGatewayAccount=true: this stack owns the account-wide API Gateway
# CloudWatch Logs role in ap-south-1. Leave it true. A *second* stack in the
# same account and region must use false — only one can own that slot.
#
# ResetTokenSecret is deliberately absent — it has no template default and is
# a secret, so this list alone cannot create a stack. Use `npm run deploy:env`.
parameter_overrides = "ProjectName=\"internal-demo\" Environment=\"dev\" ApiStageName=\"v1\" CognitoUserPoolId=\"ap-south-1_2IovW5ez1\" CognitoUserPoolArn=\"arn:aws:cognito-idp:ap-south-1:575228958582:userpool/ap-south-1_2IovW5ez1\" CognitoUserPoolClientId=\"1mq07g6gh0i9s7cr8lpsta68t7\" CorsAllowOrigin=\"*\" LogRetentionInDays=\"1\" LogLevel=\"info\" ThrottlingRateLimit=\"50\" ThrottlingBurstLimit=\"100\" ManageApiGatewayAccount=\"true\""
