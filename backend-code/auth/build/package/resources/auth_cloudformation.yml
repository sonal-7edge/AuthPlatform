  ApiDeployment664fe11cc51b:
    Type: "AWS::ApiGateway::Deployment"
    DependsOn:
      - AuthChangePasswordCorsMethod
      - AuthDeleteAccountCorsMethod
      - AuthForgotPasswordCorsMethod
      - AuthLogoutCorsMethod
      - AuthRefreshCorsMethod
      - AuthResendOtpCorsMethod
      - AuthResetPasswordCorsMethod
      - AuthSigninCorsMethod
      - AuthSignupCorsMethod
      - AuthTokensCorsMethod
      - AuthVerifyOtpCorsMethod
      - AuthVerifyResetOtpCorsMethod
      - ChangePasswordMethod
      - DeleteAccountMethod
      - ForgotPasswordMethod
      - LogoutMethod
      - RefreshMethod
      - ResendOtpMethod
      - ResetPasswordMethod
      - SigninMethod
      - SignupMethod
      - TokensMethod
      - VerifyOtpMethod
      - VerifyResetOtpMethod
    Properties:
      RestApiId:
        Ref: AuthRestApi
      Description:
        Fn::Sub: "Routes fingerprint 664fe11cc51b — ${Environment}"
  ApiStage:
    Type: "AWS::ApiGateway::Stage"
    Properties:
      RestApiId:
        Ref: AuthRestApi
      DeploymentId:
        Ref: ApiDeployment664fe11cc51b
      StageName:
        Ref: ApiStageName
      Description:
        Fn::Sub: "${Environment} stage"
      TracingEnabled:
        Fn::If:
          - XRayEnabled
          - true
          - false
      AccessLogSetting:
        DestinationArn:
          Fn::GetAtt:
            - ApiAccessLogGroup
            - Arn
        Format: "{\"requestId\":\"$context.requestId\",\"ip\":\"$context.identity.sourceIp\",\"requestTime\":\"$context.requestTime\",\"httpMethod\":\"$context.httpMethod\",\"resourcePath\":\"$context.resourcePath\",\"status\":\"$context.status\",\"protocol\":\"$context.protocol\",\"responseLength\":\"$context.responseLength\",\"integrationLatency\":\"$context.integrationLatency\",\"responseLatency\":\"$context.responseLatency\",\"userAgent\":\"$context.identity.userAgent\",\"errorMessage\":\"$context.error.message\"}"
      MethodSettings:
        - ResourcePath: "/*"
          HttpMethod: "*"
          LoggingLevel: INFO
          DataTraceEnabled: false
          MetricsEnabled: true
          ThrottlingRateLimit:
            Ref: ThrottlingRateLimit
          ThrottlingBurstLimit:
            Ref: ThrottlingBurstLimit
      Tags:
        - Key: Project
          Value:
            Ref: ProjectName
        - Key: Environment
          Value:
            Ref: Environment
        - Key: ManagedBy
          Value: cloudformation
Outputs:
  ApiInvokeUrl:
    Description: Base URL for the auth API — set this as VITE_API_BASE_URL.
    Value:
      Fn::Sub: "https://${AuthRestApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/${ApiStageName}"
    Export:
      Name:
        Fn::Sub: "${ProjectName}-${Environment}-auth-api-url"
  RestApiId:
    Description: API Gateway REST API id.
    Value:
      Ref: AuthRestApi
    Export:
      Name:
        Fn::Sub: "${ProjectName}-${Environment}-auth-api-id"
  StageName:
    Description: Deployed stage name.
    Value:
      Ref: ApiStageName
  LambdaExecutionRoleArn:
    Description: Execution role shared by the auth functions.
    Value:
      Fn::GetAtt:
        - LambdaExecutionRole
        - Arn
    Export:
      Name:
        Fn::Sub: "${ProjectName}-${Environment}-auth-lambda-role-arn"
  ApiAccessLogGroupName:
    Description: CloudWatch log group receiving API Gateway access logs.
    Value:
      Ref: ApiAccessLogGroup
  DeployedArtifact:
    Description: S3 location of the deployed Lambda package.
    Value:
      Fn::Sub: "s3://${ArtifactBucket}/${ArtifactKey}"
  EndpointCount:
    Description: Number of routes in this stack.
    Value: "12"
