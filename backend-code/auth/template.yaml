AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >-
  AuthPlatform auth API — one Lambda + CloudWatch log group per route, behind
  an API Gateway REST API. Verification codes are sent by Cognito itself, so
  this stack needs no SES or SNS access.

# ===========================================================================
# HOW TO ADD AN ENDPOINT
#
#   1. Write the handler:  handlers/my-thing.js  ->  exports.handler
#   2. Copy any block from the "ROUTES" section below and change five things:
#        the two logical ids   MyThingLogGroup / MyThingFunction
#        LogGroupName suffix   -my-thing
#        FunctionName suffix   -my-thing
#        Handler               handlers/my-thing.handler
#        Path                  /auth/my-thing
#   3. Protected route? add the Auth block (see ChangePasswordFunction).
#   4. From this folder (where package.json and samconfig.toml are):
#        npm run deploy:env
#
# Everything shared — runtime, memory, timeout, env vars — is in Globals, so
# a new endpoint is ~18 lines and repeats nothing.
#
# CodeUri is this folder, so it is self-contained: package.json, samconfig.toml
# and the handlers all live here, and sam installs dependencies from the
# package.json beside this template. Handler paths are therefore handlers/*.
# That is what lets the whole folder be dropped into any project and deployed
# without touching anything outside it.
#
# The log group is separate from the function on purpose: it is the only way
# to control retention. Without it Lambda creates the group itself on first
# invocation and keeps logs forever.
# ===========================================================================

Metadata:
  cfn-lint:
    config:
      ignore_checks:
        # AWS::Serverless::Api generates the OpenAPI Body, so cfn-lint warns
        # that the two GatewayResponse resources also touch this REST API.
        # They are deliberate — SAM exposes no GatewayResponses property, and
        # without them a 401/429 from API Gateway itself reaches the browser
        # with no CORS headers, as an opaque network error.
        - W3660
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label: { default: Naming }
        Parameters: [ProjectName, Environment, ApiStageName]
      - Label: { default: Cognito }
        Parameters:
          - CognitoUserPoolId
          - CognitoUserPoolArn
          - CognitoUserPoolClientId
          - CognitoClientSecret
      - Label: { default: Password reset }
        Parameters:
          - ResetTokenSecret
          - ResetTokenTtlSeconds
      - Label: { default: Observability & limits }
        Parameters:
          - CorsAllowOrigin
          - LogRetentionInDays
          - LogLevel
          - ThrottlingRateLimit
          - ThrottlingBurstLimit
          - ManageApiGatewayAccount

Parameters:
  ProjectName:
    Type: String
    Default: authplatform
    AllowedPattern: "^[a-z][a-z0-9-]{1,28}[a-z0-9]$"
    Description: Prefix for every resource name created by this stack.

  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]
    Description: Deployment environment.

  ApiStageName:
    Type: String
    Default: v1
    AllowedPattern: "^[a-zA-Z0-9_-]+$"
    Description: Stage name; becomes the first path segment of the invoke URL.

  CognitoUserPoolId:
    Type: String
    Description: User pool the handlers talk to. Reaches them as COGNITO_USER_POOL_ID.

  CognitoUserPoolArn:
    Type: String
    AllowedPattern: "^arn:aws[a-zA-Z-]*:cognito-idp:.+$"
    Description: Same pool as an ARN, for the API's Cognito authorizer.

  CognitoUserPoolClientId:
    Type: String
    Description: App client id. Reaches the handlers as COGNITO_CLIENT_ID.

  # lib/Cognito.js computes SECRET_HASH from the literal secret, so the value
  # itself has to reach the runtime — an ARN would not be enough.
  CognitoClientSecret:
    Type: String
    Default: ""
    NoEcho: true
    Description: App client secret, if the client has one. Empty for a public client.

  # lib/resetToken.js HMACs the resetToken with this. It has no default on
  # purpose: an empty secret would make crypto.createHmac throw at runtime, and
  # a shared default would let anyone forge a token that resets any account.
  ResetTokenSecret:
    Type: String
    NoEcho: true
    MinLength: 32
    Description: >-
      Long random secret signing the forgot-password resetToken. Required —
      generate with `openssl rand -base64 48`. Rotating it invalidates every
      reset token currently in flight, which is harmless.

  ResetTokenTtlSeconds:
    Type: Number
    Default: 600
    MinValue: 60
    MaxValue: 3600
    Description: How long a resetToken stays valid between verify-reset-otp and reset-password.

  CorsAllowOrigin:
    Type: String
    Default: "*"
    Description: Value returned in Access-Control-Allow-Origin. Lock this down outside dev.

  LogRetentionInDays:
    Type: Number
    Default: 30
    AllowedValues: [1, 3, 5, 7, 14, 30, 60, 90, 120, 150, 180, 365, 400, 545, 731, 1096, 1827, 3653]
    Description: Retention applied to every log group this stack creates.

  LogLevel:
    Type: String
    Default: info
    AllowedValues: [debug, info, warn, error]
    Description: LOG_LEVEL environment variable passed to every function.

  ThrottlingRateLimit:
    Type: Number
    Default: 50
    Description: Steady-state requests per second per method.

  ThrottlingBurstLimit:
    Type: Number
    Default: 100
    Description: Burst capacity per method.

  ManageApiGatewayAccount:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: >-
      Set true once per account/region to let this stack own the API Gateway
      CloudWatch Logs role. Leave false if another stack already set it.

Conditions:
  HasClientSecret: !Not [!Equals [!Ref CognitoClientSecret, ""]]
  ManageApiGatewayAccountSetting: !Equals [!Ref ManageApiGatewayAccount, "true"]

# ---------------------------------------------------------------------------
# Shared by every function below.
# ---------------------------------------------------------------------------
Globals:
  Function:
    Runtime: nodejs24.x
    Architectures: [arm64]
    # This folder — sam copies it and installs the production dependencies
    # from the package.json beside this template. Handlers are handlers/*.
    CodeUri: ./
    MemorySize: 256
    Timeout: 15
    Environment:
      Variables:
        NODE_OPTIONS: --enable-source-maps
        PROJECT_NAME: !Ref ProjectName
        ENVIRONMENT: !Ref Environment
        LOG_LEVEL: !Ref LogLevel
        # These names are what lib/Cognito.js and lib/verifyIdToken.js read.
        COGNITO_USER_POOL_ID: !Ref CognitoUserPoolId
        COGNITO_CLIENT_ID: !Ref CognitoUserPoolClientId
        COGNITO_CLIENT_SECRET: !Ref CognitoClientSecret
        CORS_ALLOW_ORIGIN: !Ref CorsAllowOrigin
        # Read by lib/resetToken.js (verify_reset_otp.js / reset_password.js).
        RESET_TOKEN_SECRET: !Ref ResetTokenSecret
        RESET_TOKEN_TTL_SECONDS: !Ref ResetTokenTtlSeconds

Resources:

  # =========================================================================
  # API GATEWAY
  # =========================================================================

  AuthApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub ${ProjectName}-${Environment}-auth-api
      Description: AuthPlatform authentication API
      StageName: !Ref ApiStageName
      EndpointConfiguration:
        Type: REGIONAL
      MinimumCompressionSize: 1024
      # API Gateway answers OPTIONS itself (MOCK integration), so a browser
      # preflight never pays for a Lambda cold start. The single quotes inside
      # these strings are required — API Gateway wants a quoted literal.
      Cors:
        AllowOrigin: !Sub "'${CorsAllowOrigin}'"
        AllowHeaders: "'Content-Type,Authorization,X-Amz-Date,X-Api-Key,X-Amz-Security-Token,X-Requested-With'"
        AllowMethods: "'OPTIONS,POST'"
        MaxAge: "'600'"
      Auth:
        Authorizers:
          CognitoAuthorizer:
            UserPoolArn: !Ref CognitoUserPoolArn
            Identity:
              Header: Authorization
        # No DefaultAuthorizer on purpose: a public route is one with no Auth
        # block. SAM only accepts the literal "NONE" when a default exists.
      AccessLogSetting:
        DestinationArn: !GetAtt ApiAccessLogGroup.Arn
        Format: >-
          {"requestId":"$context.requestId","ip":"$context.identity.sourceIp","requestTime":"$context.requestTime","httpMethod":"$context.httpMethod","resourcePath":"$context.resourcePath","status":"$context.status","protocol":"$context.protocol","responseLength":"$context.responseLength","integrationLatency":"$context.integrationLatency","responseLatency":"$context.responseLatency","userAgent":"$context.identity.userAgent","errorMessage":"$context.error.message"}
      MethodSettings:
        - ResourcePath: "/*"
          HttpMethod: "*"
          LoggingLevel: INFO
          DataTraceEnabled: false
          MetricsEnabled: true
          ThrottlingRateLimit: !Ref ThrottlingRateLimit
          ThrottlingBurstLimit: !Ref ThrottlingBurstLimit

  ApiAccessLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/apigateway/${ProjectName}-${Environment}-auth
      RetentionInDays: !Ref LogRetentionInDays

  # A 401/403/429 raised by API Gateway itself carries no CORS headers without
  # these, and shows up in the browser as an opaque network error.
  GatewayResponseDefault4XX:
    Type: AWS::ApiGateway::GatewayResponse
    Properties:
      RestApiId: !Ref AuthApi
      ResponseType: DEFAULT_4XX
      ResponseParameters:
        gatewayresponse.header.Access-Control-Allow-Origin: !Sub "'${CorsAllowOrigin}'"
        gatewayresponse.header.Access-Control-Allow-Headers: "'Content-Type,Authorization'"

  GatewayResponseDefault5XX:
    Type: AWS::ApiGateway::GatewayResponse
    Properties:
      RestApiId: !Ref AuthApi
      ResponseType: DEFAULT_5XX
      ResponseParameters:
        gatewayresponse.header.Access-Control-Allow-Origin: !Sub "'${CorsAllowOrigin}'"
        gatewayresponse.header.Access-Control-Allow-Headers: "'Content-Type,Authorization'"

  # API Gateway stores its CloudWatch Logs role per account+region, not per
  # stack. Stage access logging fails at create time if nothing has ever set
  # it, so this stack takes ownership only when asked to.
  ApiGatewayCloudWatchRole:
    Type: AWS::IAM::Role
    Condition: ManageApiGatewayAccountSetting
    Properties:
      RoleName: !Sub ${ProjectName}-${Environment}-apigw-logs-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: apigateway.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AmazonAPIGatewayPushToCloudWatchLogs

  ApiGatewayAccount:
    Type: AWS::ApiGateway::Account
    Condition: ManageApiGatewayAccountSetting
    Properties:
      CloudWatchRoleArn: !GetAtt ApiGatewayCloudWatchRole.Arn

  # =========================================================================
  # IAM — one execution role shared by all fifteen functions
  # =========================================================================

  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${ProjectName}-${Environment}-auth-lambda-role
      Description: Execution role shared by every auth function.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: auth-service-access
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: WriteFunctionLogs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  - !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${ProjectName}-${Environment}-*:*

              # Used by the implemented handlers today.
              - Sid: CognitoUserPoolAccess
                Effect: Allow
                Action:
                  - cognito-idp:SignUp                    # signup
                  - cognito-idp:ConfirmSignUp             # verify-otp
                  - cognito-idp:ResendConfirmationCode    # resend-otp
                  - cognito-idp:AdminInitiateAuth         # signin, refresh, password re-check
                  - cognito-idp:AdminGetUser
                  - cognito-idp:AdminUserGlobalSignOut    # logout
                  - cognito-idp:ForgotPassword            # forgot-password
                  - cognito-idp:ConfirmForgotPassword     # verify-reset-otp
                  - cognito-idp:AdminSetUserPassword      # reset-password, change-password
                  - cognito-idp:AdminDeleteUser           # delete-account
                Resource: !Ref CognitoUserPoolArn


  # =========================================================================
  # ROUTES — public (no Auth block)
  # =========================================================================

  SignupLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${ProjectName}-${Environment}-signup
      RetentionInDays: !Ref LogRetentionInDays

  SignupFunction:
    Type: AWS::Serverless::Function
    DependsOn: SignupLogGroup
    Properties:
      FunctionName: !Sub ${ProjectName}-${Environment}-signup
      Description: Register a new user in the Cognito user pool
      # The implemented handler is sign_up.js, not signup.js.
      Handler: handlers/sign_up.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Events:
        Post:
          Type: Api
          Properties:
            RestApiId: !Ref AuthApi
            Path: /auth/signup
            Method: post

  SigninLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${ProjectName}-${Environment}-signin
      RetentionInDays: !Ref LogRetentionInDays

  SigninFunction:
    Type: AWS::Serverless::Function
    DependsOn: SigninLogGroup
    Properties:
      FunctionName: !Sub ${ProjectName}-${Environment}-signin
      Description: Authenticate a user and start the OTP challenge
      Handler: handlers/sign_in.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Events:
        Post:
          Type: Api
          Properties:
            RestApiId: !Ref AuthApi
            Path: /auth/signin
            Method: post

  VerifyOtpLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${ProjectName}-${Environment}-verify-otp
      RetentionInDays: !Ref LogRetentionInDays

  VerifyOtpFunction:
    Type: AWS::Serverless::Function
    DependsOn: VerifyOtpLogGroup
    Properties:
      FunctionName: !Sub ${ProjectName}-${Environment}-verify-otp
      Description: Complete the OTP round and return tokens
      Handler: handlers/verify_otp.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Events:
        Post:
          Type: Api
          Properties:
            RestApiId: !Ref AuthApi
            Path: /auth/verify-otp
            Method: post

  RefreshLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${ProjectName}-${Environment}-refresh
      RetentionInDays: !Ref LogRetentionInDays

  RefreshFunction:
    Type: AWS::Serverless::Function
    DependsOn: RefreshLogGroup
    Properties:
      FunctionName: !Sub ${ProjectName}-${Environment}-refresh
      Description: Exchange a refresh token for a new id token
      Handler: handlers/refresh_token.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Events:
        Post:
          Type: Api
          Properties:
            RestApiId: !Ref AuthApi
            Path: /auth/refresh
            Method: post

  TokensLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${ProjectName}-${Environment}-tokens
      RetentionInDays: !Ref LogRetentionInDays

  TokensFunction:
    Type: AWS::Serverless::Function
    DependsOn: TokensLogGroup
    Properties:
      FunctionName: !Sub ${ProjectName}-${Environment}-tokens
      Description: Exchange an established session (Bearer idToken) for tokens
      Handler: handlers/tokens.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Events:
        Post:
          Type: Api
          Properties:
            RestApiId: !Ref AuthApi
            Path: /auth/tokens
            Method: post
            # No longer a public route — it identifies the caller from the
            # Bearer idToken, so it gets the same gateway authorizer as the
            # other token-protected routes. The handler verifies the token
            # again itself, the way logout does.
            Auth:
              Authorizer: CognitoAuthorizer

  ResendOtpLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${ProjectName}-${Environment}-resend-otp
      RetentionInDays: !Ref LogRetentionInDays

  ResendOtpFunction:
    Type: AWS::Serverless::Function
    DependsOn: ResendOtpLogGroup
    Properties:
      FunctionName: !Sub ${ProjectName}-${Environment}-resend-otp
      Description: Resend the confirmation code
      Handler: handlers/resend-otp.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Events:
        Post:
          Type: Api
          Properties:
            RestApiId: !Ref AuthApi
            Path: /auth/resend-otp
            Method: post

  ForgotPasswordLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${ProjectName}-${Environment}-forgot-password
      RetentionInDays: !Ref LogRetentionInDays

  ForgotPasswordFunction:
    Type: AWS::Serverless::Function
    DependsOn: ForgotPasswordLogGroup
    Properties:
      FunctionName: !Sub ${ProjectName}-${Environment}-forgot-password
      Description: Start the forgot-password flow
      Handler: handlers/forgot_password.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Events:
        Post:
          Type: Api
          Properties:
            RestApiId: !Ref AuthApi
            Path: /auth/forgot-password
            Method: post

  VerifyResetOtpLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${ProjectName}-${Environment}-verify-reset-otp
      RetentionInDays: !Ref LogRetentionInDays

  VerifyResetOtpFunction:
    Type: AWS::Serverless::Function
    DependsOn: VerifyResetOtpLogGroup
    Properties:
      FunctionName: !Sub ${ProjectName}-${Environment}-verify-reset-otp
      Description: Validate the password reset code
      Handler: handlers/verify_reset_otp.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Events:
        Post:
          Type: Api
          Properties:
            RestApiId: !Ref AuthApi
            Path: /auth/verify-reset-otp
            Method: post

  ResetPasswordLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${ProjectName}-${Environment}-reset-password
      RetentionInDays: !Ref LogRetentionInDays

  ResetPasswordFunction:
    Type: AWS::Serverless::Function
    DependsOn: ResetPasswordLogGroup
    Properties:
      FunctionName: !Sub ${ProjectName}-${Environment}-reset-password
      Description: Complete the forgot-password flow with a new password
      Handler: handlers/reset_password.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Events:
        Post:
          Type: Api
          Properties:
            RestApiId: !Ref AuthApi
            Path: /auth/reset-password
            Method: post

  # =========================================================================
  # ROUTES — protected by the Cognito authorizer
  # =========================================================================

  LogoutLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${ProjectName}-${Environment}-logout
      RetentionInDays: !Ref LogRetentionInDays

  LogoutFunction:
    Type: AWS::Serverless::Function
    DependsOn: LogoutLogGroup
    Properties:
      FunctionName: !Sub ${ProjectName}-${Environment}-logout
      Description: Globally sign the user out and revoke their tokens
      Handler: handlers/logout.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Events:
        Post:
          Type: Api
          Properties:
            RestApiId: !Ref AuthApi
            Path: /auth/logout
            Method: post
            Auth:
              Authorizer: CognitoAuthorizer

  ChangePasswordLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${ProjectName}-${Environment}-change-password
      RetentionInDays: !Ref LogRetentionInDays

  # --- change-password and delete-account are the only routes left on a 501
  # --- stub: these two Handler: lines point at the hyphenated files, while
  # --- the working implementations sit in change_password.js /
  # --- delete_account.js. Switch them over the way the reset trio was.
  ChangePasswordFunction:
    Type: AWS::Serverless::Function
    DependsOn: ChangePasswordLogGroup
    Properties:
      FunctionName: !Sub ${ProjectName}-${Environment}-change-password
      Description: Change the password of the signed-in user
      Handler: handlers/change_password.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Events:
        Post:
          Type: Api
          Properties:
            RestApiId: !Ref AuthApi
            Path: /auth/change-password
            Method: post
            # This is all a protected route needs — API Gateway validates the
            # JWT and puts the claims on event.requestContext.authorizer.claims.
            Auth:
              Authorizer: CognitoAuthorizer

  DeleteAccountLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${ProjectName}-${Environment}-delete-account
      RetentionInDays: !Ref LogRetentionInDays

  DeleteAccountFunction:
    Type: AWS::Serverless::Function
    DependsOn: DeleteAccountLogGroup
    Properties:
      FunctionName: !Sub ${ProjectName}-${Environment}-delete-account
      Description: Delete the signed-in user from the user pool
      Handler: handlers/delete_account.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Events:
        Post:
          Type: Api
          Properties:
            RestApiId: !Ref AuthApi
            Path: /auth/delete-account
            Method: post
            Auth:
              Authorizer: CognitoAuthorizer

Outputs:
  ApiInvokeUrl:
    Description: Base URL for the auth API — set this as VITE_API_BASE_URL.
    Value: !Sub https://${AuthApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/${ApiStageName}
    Export:
      Name: !Sub ${ProjectName}-${Environment}-auth-api-url

  RestApiId:
    Description: API Gateway REST API id.
    Value: !Ref AuthApi
    Export:
      Name: !Sub ${ProjectName}-${Environment}-auth-api-id

  StageName:
    Description: Deployed stage name.
    Value: !Ref ApiStageName

  LambdaExecutionRoleArn:
    Description: Execution role shared by the auth functions.
    Value: !GetAtt LambdaExecutionRole.Arn
    Export:
      Name: !Sub ${ProjectName}-${Environment}-auth-lambda-role-arn

  ApiAccessLogGroupName:
    Description: CloudWatch log group receiving API Gateway access logs.
    Value: !Ref ApiAccessLogGroup

  UsingClientSecret:
    Description: Whether SECRET_HASH will be computed (an app client secret was supplied).
    Value: !If [HasClientSecret, "yes", "no"]

